name: Verify allowlist & blocklist reachability

on:
  push:
    branches: [main]
    paths:
      - "blocklists.txt"
      - "allowlists.txt"
  pull_request:
    paths:
      - "blocklists.txt"
      - "allowlists.txt"
  schedule:
    # Weekly on Monday at 8am Pacific (4pm UTC)
    - cron: "0 16 * * 1"

jobs:
  verify-list-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify allowlist & blocklist URLs
        run: |
          set -euo pipefail
          failed=0
          for file in blocklists.txt allowlists.txt; do
            echo "Checking $file"
            while IFS= read -r line || [ -n "$line" ]; do
              # Skip comments and blank lines
              [[ -z "$line" || "$line" == \#* ]] && continue

              if curl --silent --head --fail --location --connect-timeout 10 --max-time 30 "$line" > /dev/null 2>&1; then
                echo "  ✓ $line"
              else
                echo "  ✗ $line"
                failed=1
              fi
            done < "$file"
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more URLs failed to load."
            exit 1
          fi

      # Reset GitHub's 60-day scheduled-workflow inactivity timer without
      # creating dummy commits. Runs only on the cron path so PRs/pushes skip it.
      # always() is required so a sustained upstream outage — exactly when this
      # workflow matters most — can't let the timer lapse and disable the cron.
      - name: Keep workflow active
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "/repos/${{ github.repository }}/actions/workflows/verify-list-reachability.yml/enable"
